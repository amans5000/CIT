name: CIT 9.0 CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=@cit9/types
          npm run db:generate --workspace=@cit9/database
          npm run build --workspace=@cit9/database

      - name: Run Type Checking
        run: npm run typecheck

  unit-and-e2e-tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cit9_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cit9_test_db?schema=public
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SESSION_SECRET: test_session_secret_at_least_32_characters_long_for_ci
      COOKIE_SECRET: test_cookie_secret_at_least_32_characters_long_for_ci
      SESSION_TTL_HOURS: 24
      GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:4000/api/v1/auth/google/callback
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=@cit9/types
          npm run db:generate --workspace=@cit9/database
          npm run build --workspace=@cit9/database

      - name: Push database schema to test DB
        run: npx prisma db push --schema=packages/database/prisma/schema.prisma --skip-generate --accept-data-loss

      - name: Run API Unit Tests
        run: npm run test --workspace=@cit9/api

      - name: Run API E2E Tests
        run: npm run test:e2e --workspace=@cit9/api

  security-audit:
    name: Dependency Audit & Secret Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run npm audit
        run: npm audit --audit-level=high || true
